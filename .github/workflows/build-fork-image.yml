name: Build fork image

# Our fork of OpenWA (adds the poll.vote webhook — see feat/poll-vote). Builds a
# container and publishes it to GHCR so the DialerSystem fly deploy can pull it
# instead of ghcr.io/rmyndharis/openwa. See DialerSystem/docs/wa-openwa-interactive.md P2.
on:
  push:
    branches: [feat/poll-vote]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openwa:poll-vote
            ghcr.io/${{ github.repository_owner }}/openwa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
